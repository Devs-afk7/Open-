<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Open 👀</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="petals-container" id="petals"></div>
  <div class="flash-overlay" id="flashOverlay"></div>
  <div class="confetti-container" id="confetti"></div>

  <div class="card" id="card" data-shake="0">
    <div class="emoji-top" id="emojiTop">🥺</div>
    <h2 class="question" id="question">Suna na</h2>
    <div class="gif-wrapper">
      <img class="gif" id="gif" src="images/cute.gif" alt="cute">
    </div>
    <div class="btn-group" id="btnGroup">
      <button class="yes-btn" id="yesBtn">K ?</button>
      <button class="no-btn" id="noBtn">Naii sundina jau</button>
    </div>
  </div>

  <script src="main.js"></script>
</body>
</html>
